<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Universo Abierto</title>
<style>html,body{margin:0;height:100%;background:#02030a;color:#9fb4d8;font:14px system-ui,sans-serif}#jn-aviso{padding:24px}</style>
</head>
<body>
<div id="jn-aviso">Cargando…</div>
<script>
/* Cargador: pide version.json SIN caché y carga todo con ?v=versión, así cada publicación
   se ve al instante (GitHub Pages cachea 10 min los archivos con la misma URL). */
(function () {
  function fallo(m) { document.getElementById('jn-aviso').textContent = m; }
  function json(u) { return fetch(u, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(u); return r.json(); }); }
  function js(u, v) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = u + '?v=' + v; s.onload = ok; s.onerror = function () { no(new Error('No se pudo cargar ' + u)); }; document.head.appendChild(s); }); }
  json('version.json?t=' + Date.now()).then(function (j) { return j.v || Date.now(); }, function () { return Date.now(); }).then(function (v) {
    window.JN_V = String(v);
    return json('juego/modulos.json?v=' + v).then(function (m) {
      (m.css || []).forEach(function (c) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = c + '?v=' + v; document.head.appendChild(l); });
      return m.js.reduce(function (p, f) { return p.then(function () { return js(f, v); }); }, Promise.resolve());
    });
  }).then(function () { var a = document.getElementById('jn-aviso'); if (a) a.remove(); }, function (e) { fallo('Error al cargar el juego: ' + e.message); });
})();
</script>
</body>
</html>
